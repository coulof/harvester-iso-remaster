name: Build and Publish Container Image to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'remaster-iso.sh'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'vendor/**'
      - '.github/workflows/container.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the container image (e.g. v1.8.2 or latest)'
        required: true
        default: 'v1.8.2'
      publish_latest:
        description: 'Also tag and push as :latest'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Image Tags
        id: meta
        run: |
          set -euo pipefail
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}"

          TAGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            TAGS+=("${IMAGE}:${INPUT_TAG}")
            if [ "${{ github.event.inputs.publish_latest }}" = "true" ]; then
              TAGS+=("${IMAGE}:latest")
            fi
            VERSION="${INPUT_TAG}"
          else
            # Push to main
            TAGS+=("${IMAGE}:latest")
            VERSION="latest"
          fi

          TAGS_STR=$(IFS=,; echo "${TAGS[*]}")
          echo "tags=${TAGS_STR}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "[+] Target tags: ${TAGS_STR}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
